name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # verify = checkstyle + spotless + compile + unit tests + jar.
      # xvfb provides the display JavaFX-touching tests need on a headless runner.
      - name: Build & run tests
        run: xvfb-run -a mvn -B verify

  package:
    name: Package — ${{ matrix.name }}
    needs: [ check ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (dmg)
            os: macos-latest
            type: DMG
            artifact: target/dist/*.dmg
          - name: Linux x86_64 (AppImage)
            os: ubuntu-latest
            type: APP_IMAGE
            artifact: target/appimage/*.AppImage
          - name: Windows x86_64 (msi)
            os: windows-latest
            type: MSI
            artifact: target/dist/*.msi

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      # tests already ran in the check job
      - name: Build application image
        run: mvn -B verify "-Papp" "-DskipTests" "-Dapp.type=${{ matrix.type }}"

      - name: Install appimagetool (Linux only)
        if: matrix.type == 'APP_IMAGE'
        run: |
          wget -q -O appimagetool.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /opt/appimagetool
          printf '#!/bin/sh\nexec /opt/appimagetool --appimage-extract-and-run "$@"\n' | sudo tee /usr/local/bin/appimagetool > /dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Bundle AppImage (Linux only)
        if: matrix.type == 'APP_IMAGE'
        run: bash scripts/package-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vault-${{ matrix.type }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft release
    needs: [ package ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'

      - name: Read project version
        id: version
        run: echo "version=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MediaDB v${{ steps.version.outputs.version }}
          body: See the assets to download this version and install.
          draft: true
          files: dist/**
